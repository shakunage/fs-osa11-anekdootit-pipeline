name: dev-anekdootit-containerized

services:
  frontend:
    image: dev-anekdootit-frontend
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    container_name: dev-anekdootit-frontend
    volumes:
      - ./frontend:/usr/src/app # The path can be relative, so ./ is enough to say "the same location as the docker-compose.yml"
  backend:
    image: dev-anekdootit-backend
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    container_name: dev-anekdootit-backend
  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: dev-reverse-proxy
    depends_on:
      - frontend
      - backend